[package]
name = "bri-addon-import"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Offline importer: one legacy Blockland Add-On to a native package plus a machine-readable report"

[[bin]]
name = "bri-import-addon"
path = "src/main.rs"

# TEMPORARY: one-shot content migrator; delete this entry (and the file) once
# all installed content has been converted to GLB.
[[bin]]
name = "migrate-content"
path = "src/bin/migrate-content.rs"

# TEMPORARY: one-shot renamer that restores original Blockland file names for
# hash-named assets; delete this entry (and the file) once content is renamed.
[[bin]]
name = "rename-content"
path = "src/bin/rename-content.rs"

# TEMPORARY: one-shot migrator that converts interior JSON files to
# self-contained .glb files and gives baked lightmaps structural names;
# delete this entry (and the file) once all installed content is converted.
[[bin]]
name = "convert-map-interiors"
path = "src/bin/convert-map-interiors.rs"

# TEMPORARY: one-shot backfill that puts a model's presentation-table texture
# references inside its .glb (a solid colour as baseColorFactor, a patterned
# picture embedded); delete this entry (and the file) once content is done.
[[bin]]
name = "backfill-glb-textures"
path = "src/bin/backfill-glb-textures.rs"

# TEMPORARY: one-shot backfill that bakes a brick's authored colours into real
# glTF materials (baseColorFactor, BLEND where transparent) so Blender matches
# the game; delete this entry (and the file) once content is done.
[[bin]]
name = "backfill-brick-materials"
path = "src/bin/backfill-brick-materials.rs"

# TEMPORARY: one-shot backfill that gives a brick's runtime-coloured surfaces
# (plain paint, offsets) a placeholder `blank` material plus the full
# paint_offsets marker so editors see every surface; delete this entry (and
# the file) once content is done.
[[bin]]
name = "backfill-blank-materials"
path = "src/bin/backfill-blank-materials.rs"

# TEMPORARY: one-shot writer of the shared pre-composited brick surface
# pictures that brick placeholders reference by relative URI (stored once
# beside the brick-materials bundle, not embedded per file); delete this entry
# (and the file) once content is done.
[[bin]]
name = "gen-brick-surface-pictures"
path = "src/bin/gen-brick-surface-pictures.rs"

# TEMPORARY: one-shot migrator that retires a brick's legacy void primitives
# and bakes its fully-clamped paint offsets to literal materials so the GLB
# carries exactly what the game draws; delete this entry (and the file) once
# content is done.
[[bin]]
name = "normalize-brick-glbs"
path = "src/bin/normalize-brick-glbs.rs"

# TEMPORARY: one-shot migrator that rewrites a JSON avatar rig bundle to a
# self-contained GLB (every sequence inside the file's animations); delete
# this entry (and the file) once content is done.
[[bin]]
name = "avatar-to-glb"
path = "src/bin/avatar-to-glb.rs"

# TEMPORARY: one-shot migrator that bakes the last .clips.json sequences into
# their vehicle models' GLBs and rewrites the weapon-debris JSON shapes to
# self-contained GLBs; delete this entry (and the file) once content is done.
[[bin]]
name = "clips-to-glb"
path = "src/bin/clips-to-glb.rs"

# TEMPORARY: one-shot re-exporter that regenerates a single .shape.json as a
# self-contained GLB with the current exporter (used to rebuild steel-ball.glb
# once bare-metal materials learned to ride through glTF); delete this entry
# (and the file) when no more JSON shapes need regenerating.
[[bin]]
name = "shape-json-to-glb"
path = "src/bin/shape-json-to-glb.rs"

[dependencies]
bri-console = { path = "../console" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
bri-content = { path = "../content" }
bri-gltf = { path = "../gltf" }
bri-convert = { path = "../convert" }
bri-package = { path = "../package" }
bri-package-runtime = { path = "../package-runtime" }
bri-weapons = { path = "../weapons" }
bri-weapons-import = { path = "../weapons-import" }
bri-vehicles = { path = "../vehicles" }
bri-vehicles-import = { path = "../vehicles-import" }
regex.workspace = true
glam.workspace = true
image = { workspace = true, features = ["jpeg"] }
sha2.workspace = true
zip.workspace = true
bri-foliage = { path = "../foliage", default-features = false }
bri-effects-render = { path = "../effects-render" }

[dev-dependencies]
bri-admin = { path = "../admin" }
bri-minigames = { path = "../minigames" }
bri-net = { path = "../net" }
bri-sim = { path = "../sim" }
bri-world = { path = "../world" }
bri-physics = { path = "../physics" }
bri-render = { path = "../render" }
rapier3d.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
