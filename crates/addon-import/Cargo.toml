[package]
name = "bri-addon-import"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Offline importer: one legacy Blockland Add-On to a native package plus a machine-readable report"

[[bin]]
name = "bri-import-addon"
path = "src/main.rs"

[dependencies]
bri-console = { path = "../console" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
bri-content = { path = "../content" }
bri-convert = { path = "../convert" }
bri-package = { path = "../package" }
bri-package-runtime = { path = "../package-runtime" }
bri-weapons = { path = "../weapons" }
bri-weapons-import = { path = "../weapons-import" }
bri-vehicles = { path = "../vehicles" }
bri-vehicles-import = { path = "../vehicles-import" }
regex.workspace = true
glam.workspace = true
image = { workspace = true, features = ["jpeg"] }
sha2.workspace = true
zip.workspace = true

[dev-dependencies]
bri-admin = { path = "../admin" }
bri-minigames = { path = "../minigames" }
bri-net = { path = "../net" }
bri-sim = { path = "../sim" }
bri-world = { path = "../world" }
bri-physics = { path = "../physics" }
rapier3d.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
