[package]
name = "bri-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mimalloc.workspace = true
imbl.workspace = true
bri-files.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
bri-content = { path = "../content" }
bri-world = { path = "../world" }
bri-events = { path = "../events" }
bri-bls = { path = "../bls" }
bri-weapons = { path = "../weapons" }
bri-package = { path = "../package" }
bri-package-runtime = { path = "../package-runtime" }
bri-sim = { path = "../sim" }
bri-admin.workspace = true
bri-minigames = { path = "../minigames" }
bri-vehicles = { path = "../vehicles" }
bri-identity = { path = "../identity" }
bri-progress = { path = "../progress" }
bri-net = { path = "../net" }
bri-crash = { path = "../crash" }
bri-render = { path = "../render" }
bri-ui = { path = "../ui" }
bri-console = { path = "../console" }
bri-physics = { path = "../physics" }
bri-fx-runtime = { path = "../fx-runtime" }
bri-audio = { path = "../audio", features = ["cpal-output"] }
rapier3d.workspace = true
glam.workspace = true
winit = "0.30"
# winit_log.rs: winit reports event loop failures through tracing.
tracing-core = "0.1"
gilrs = "0.11"
wgpu.workspace = true
pollster.workspace = true
image = { workspace = true, features = ["jpeg"] }
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# The once-per-start release check (updates.rs): rustls on the ring crypto
# the network stack already uses, trusting the certificates Windows trusts
# (antivirus HTTPS scanning and company proxies add their own).
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

bri-weather = { path = "../weather" }

bri-foliage = { path = "../foliage" }
arboard = { version = "3", default-features = false }
bri-client-sandbox = { path = "../client-sandbox" }

# Checking the window and GPU libraries before they are needed
# (system_libraries.rs).
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_System_WindowsProgramming", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_SystemInformation"] }


[target.'cfg(windows)'.dev-dependencies]
# large_build_perf's in-process sampling profiler (stack unwinding, symbols).
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile.workspace = true
# Paused clocks for the loading watchdog tests.
tokio = { workspace = true, features = ["test-util"] }
bri-addon-import = { path = "../addon-import" }
