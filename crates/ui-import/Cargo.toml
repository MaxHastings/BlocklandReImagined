[package]
name = "bri-ui-import"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
description = "Offline converter: Blockland v20 UI art, font caches, GUI layouts and UI data -> native bri-ui pack"

[dependencies]
bri-console = { path = "../console" }
bri-ui = { path = "../ui", default-features = false }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { workspace = true, features = ["jpeg"] }
zip.workspace = true
sha2.workspace = true
