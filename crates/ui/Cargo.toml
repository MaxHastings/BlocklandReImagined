[package]
name = "bri-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
description = "Blockland ReImagined native UI: layout, skins, cached fonts, widgets, screens and interaction state machines"

[features]
default = ["gpu"]
# wgpu renderer for the UI draw list (offscreen and swapchain targets).
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
anyhow.workspace = true
bri-console = { path = "../console" }
bri-events = { path = "../events" }
bri-content = { path = "../content" }
serde.workspace = true
serde_json.workspace = true
ab_glyph = "0.2.32"
memmap2 = "0.9"
image = { workspace = true, features = ["jpeg"] }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[[bin]]
name = "ui_gallery"
required-features = ["gpu"]
test = false

[[bin]]
name = "ui_runtime_probe"
required-features = ["gpu"]
test = false

[[bin]]
name = "ml_text_probe"
required-features = ["gpu"]
test = false

[dev-dependencies]
bri-package = { path = "../package" }

# CLI probes have no unit tests; keep building the actual executables,
# without linking duplicate empty libtest harnesses.
[[bin]]
name = "controls_probe"
path = "src/bin/controls_probe.rs"
test = false
