[package]
name = "bri-net"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
mimalloc.workspace = true
imbl.workspace = true
bri-files.workspace = true
bri-weapons = { path = "../weapons" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
bri-package = { path = "../package" }
bri-content = { path = "../content" }
bri-world = { path = "../world" }
bri-progress = { path = "../progress" }
bri-sim = { path = "../sim" }
bri-admin = { path = "../admin" }
bri-identity = { path = "../identity" }
bri-vehicles = { path = "../vehicles" }
bri-events = { path = "../events" }
bri-package-runtime = { path = "../package-runtime" }
glam.workspace = true
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }
getrandom = "0.4"
sha2.workspace = true
ring.workspace = true
zstd.workspace = true
rmp-serde.workspace = true
bri-crash = { path = "../crash" }
igd-next = { version = "0.17", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis", "Win32_Media"] }

[dev-dependencies]
tempfile.workspace = true
rapier3d.workspace = true
bri-physics = { path = "../physics" }
bri-minigames = { path = "../minigames" }

[package.metadata.cargo-machete]
# Used only through `#[serde(with = "serde_bytes")]`, which machete cannot see.
ignored = ["serde_bytes"]
