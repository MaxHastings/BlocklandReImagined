[package]
name = "bri-chaos"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Crash hunting: property tests over the crash-prone engine seams and a chaos soak of bots doing everything at once"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
bri-admin = { path = "../admin" }
bri-content = { path = "../content" }
bri-physics = { path = "../physics" }
bri-world = { path = "../world" }
bri-sim = { path = "../sim" }
bri-net = { path = "../net" }
bri-weapons = { path = "../weapons" }
bri-vehicles = { path = "../vehicles" }
bri-package = { path = "../package" }
glam = "0.33"
rapier3d = { version = "=0.36.0", features = ["enhanced-determinism"] }
rmp = "0.8"
rmp-serde = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
bri-addon-import = { path = "../addon-import" }
bri-events = { path = "../events" }
proptest = "1"
zstd = "0.13"
