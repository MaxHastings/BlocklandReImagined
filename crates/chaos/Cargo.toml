[package]
name = "bri-chaos"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Crash hunting: property tests over the crash-prone engine seams and a chaos soak of bots doing everything at once"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
bri-admin = { path = "../admin" }
bri-content = { path = "../content" }
bri-physics = { path = "../physics" }
bri-world = { path = "../world" }
bri-sim = { path = "../sim" }
bri-net = { path = "../net" }
bri-weapons = { path = "../weapons" }
bri-vehicles = { path = "../vehicles" }
bri-package = { path = "../package" }
glam.workspace = true
rapier3d.workspace = true
rmp = "0.8"
rmp-serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# Strategies for the shared JSON damage (`mutate`) the fuzz tests use.
proptest = "1"

[dev-dependencies]
bri-addon-import = { path = "../addon-import" }
bri-bls = { path = "../bls" }
bri-events = { path = "../events" }
bri-minigames = { path = "../minigames" }
bri-package-runtime = { path = "../package-runtime" }
zstd.workspace = true
