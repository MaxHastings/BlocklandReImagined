[package]
name = "bri-weather"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:bytemuck"]

[dependencies]
bri-console = { path = "../console" }
bri-render = { path = "../render" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
glam.workspace = true
image.workspace = true
bytemuck = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
bri-package = { path = "../package" }
pollster.workspace = true

[[example]]
name = "offscreen_weather"
required-features = ["gpu"]

