[package]
name = "bri-weather"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:bytemuck"]

[dependencies]
bri-render = { path = "../render" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"], optional = true }

[dev-dependencies]
pollster = "0.4"

[[example]]
name = "offscreen_weather"
required-features = ["gpu"]

