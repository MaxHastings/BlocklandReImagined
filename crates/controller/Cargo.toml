[package]
name = "bri-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bri-motor = { path = "../motor" }
anyhow.workspace = true
glam.workspace = true
# Same runtime and line as the client sandbox (`bri-client-sandbox`), so the
# workspace builds one WebAssembly compiler. Fuel only: no epochs, which
# count wall-clock time and would make a step's outcome depend on the
# machine.
wasmtime = { version = "45", default-features = false, features = ["std", "runtime", "cranelift"] }

[dev-dependencies]
wat = "=1.248.0"
