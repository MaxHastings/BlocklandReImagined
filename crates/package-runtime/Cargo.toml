[package]
name = "bri-package-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bri-console = { path = "../console" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
bri-package = { path = "../package" }
bri-content = { path = "../content" }
bri-weapons = { path = "../weapons" }
bri-audio = { path = "../audio" }
sha2.workspace = true
rhai = { version = "1.26", default-features = false, features = ["std", "sync", "serde", "no_module", "no_custom_syntax", "no_time", "internals"] }

[dev-dependencies]
tempfile.workspace = true

# CLI probes have no unit tests; keep building the actual executables,
# without linking duplicate empty libtest harnesses.
[[bin]]
name = "bri-addon-check"
path = "src/bin/bri-addon-check.rs"
test = false
