[package]
name = "bri-rendezvous"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Join codes, NAT hole punching and relay for Blockland ReImagined hosts (self-hostable service)"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
getrandom = "0.4"
sha2 = "0.10"
