[package]
name = "bri-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The standalone BlocklandReImagined.exe: carries the packaged game, unpacks it per user and runs it."

[[bin]]
name = "BlocklandReImagined"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
bri-crash = { path = "../crash" }
sha2 = "0.10"
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
