[package]
name = "bri-vehicles"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = { version = "0.33", features = ["serde"] }
rapier3d = { version = "=0.36.0", features = ["enhanced-determinism"] }
sha2 = "0.10"
[dev-dependencies]
bri-physics = { path = "../physics" }
