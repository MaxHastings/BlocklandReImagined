[package]
name = "bri-audio-import"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
description = "Offline converter: vanilla Blockland v20 sounds/music + authored audio profiles -> native audio pack. Never executes scripts."

[[bin]]
name = "bri-audio-import"
path = "src/main.rs"

[dependencies]
bri-audio = { path = "../audio" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true

[[bin]]
name = "bri-audio-evidence"
path = "src/bin/audio_evidence.rs"
