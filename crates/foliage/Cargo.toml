[package]
name = "bri-foliage"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
glam = { version = "0.33", features = ["serde"] }
bytemuck = { version = "1.25", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std","parking_lot","dx12","vulkan","metal","wgsl"] }
[dev-dependencies]
bri-content = { path = "../content" }
pollster = "0.4"
bri-physics = { path = "../physics" }
rapier3d = { version = "=0.36.0", features = ["enhanced-determinism"] }
