# `f32::clamp` and `f64::clamp` panic inside `core` when a bound is NaN or
# the bounds are reversed, and the report never names the caller. Use
# `bri_console::Clamp::clamped`, which names it and does not end the game.
# wgpu's `create_buffer_init` panics filling a buffer once the device is lost
# (a friend's integrated GPU, 2026-10-06), before the renderer can restart.
disallowed-methods = [
    { path = "f32::clamp", reason = "use bri_console::Clamp::clamped: it names a caller whose bounds are out of order" },
    { path = "f64::clamp", reason = "use bri_console::Clamp::clamped: it names a caller whose bounds are out of order" },
    { path = "wgpu::util::DeviceExt::create_buffer_init", reason = "use bri_render::BufferInit::buffer_init: it survives a lost device" },
]
