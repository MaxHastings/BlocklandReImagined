[workspace]
members = ["crates/files", "crates/chaos", "crates/crash", "crates/render", "crates/physics", "crates/content", "crates/convert", "crates/bls", "crates/world", "crates/progress", "crates/admin", "crates/identity", "crates/sim", "crates/motor", "crates/net", "crates/ui", "crates/ui-import", "crates/client", "crates/weapons", "crates/minigames", "crates/events", "crates/weapons-import", "crates/fx-runtime", "crates/fx-import", "crates/vehicles", "crates/vehicles-import", "crates/audio", "crates/audio-import", "crates/weather", "crates/weather-import", "crates/foliage", "crates/foliage-import", "crates/console", "crates/package", "crates/package-runtime", "crates/addon-import", "crates/stresslab", "crates/client-sandbox", "crates/launcher"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
anyhow = "1.0"
# The game and server binaries' allocator.
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bri-admin = { path = "crates/admin" }
bri-files = { path = "crates/files" }

# Full debug info tripled every build's output (42 GB for a cold
# `cargo build --workspace --all-targets`, 13.5 GB with these settings on
# 2026-09-28). Line tables keep file:line in panics and backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# The map lighting bake fits lights and traces rays in plain Rust; unoptimized
# it made the stock-map test take 410 s of the gate's 600 s per-binary limit.
# map_lighting's own tests, 2026-10-01: 32.6 s at opt-level 0, 4.3 s at 2,
# for 15 s more each time bri-render recompiles (`cargo check` is unaffected).
[profile.dev.package.bri-render]
opt-level = 2

# Line tables make panic backtraces and native crash dumps name files and
# lines in release builds, at no runtime cost.
[profile.release]
debug = "line-tables-only"
# Cross-crate inlining for the shipped game (serde, imbl, rapier and the
# codec live in other crates). On a 200k-brick host workload (2026-09-29,
# thin vs none): world save 39% faster, wire encode/decode 12-13%, JSON load
# 11%, collider insert 9%. Fat LTO with one codegen unit gained a further
# 5-15% but made every release relink 15x slower, which the benchmark lanes
# pay on each iteration. panic stays unwind: saves and chaos catch panics.
lto = "thin"
