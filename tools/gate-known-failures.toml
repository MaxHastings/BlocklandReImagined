# Test targets that host a game on the fixed ports (UDP 28000/28050). The gate
# runs them one at a time, after one another, instead of in parallel. Prefer
# BRI_TEST_HOST_PORT / BRI_TEST_DISCOVERY_PORT (see multiplayer.rs) so a test
# never needs the game's ports. Format: "<package>/<test target>".

[[port_bound]]
target = "bri-client/night_qa"

# The pull-request tier runs every test target except the slow packages': the
# end-to-end, GPU and soak suites (PR 317: shards of 32-62 minutes). Those run
# on the explicit main tier and nightly, and a failure there is reported, not
# gating. `keep` names targets of a slow package that still run on pull
# requests.
[ci_quick]
slow_packages = ["bri-client", "bri-render", "bri-chaos", "bri-net"]
keep = ["bri-client/lib", "bri-net/lib"]
# Additional targets for explicit main/full tiers: Slayer's teams
# and Capture the Flag, the ported tiers and the bundled add-ons played in
# game, 6 minutes of a shard together. They guard add-on features no pull
# request to the engine core changes by accident.
later = [
    "bri-addon-import/bundled_in_game",
    "bri-addon-import/ports",
    "bri-addon-import/slayer",
    "bri-addon-import/tier_port",
]

# What a shard pays for each test binary before it runs a test, on top of its
# seconds in tools/ci-timings.json: PR 366's four shards, 2026-10-26, took 18
# to 27 minutes for 70 to 75 binaries each while the tests themselves summed
# to 1 to 5 minutes, so build and link cost about 13 s per binary.
[ci_shards]
per_binary_seconds = 13.0
