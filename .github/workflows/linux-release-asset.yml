# Builds the Linux zip. It builds the client on the oldest supported Ubuntu
# (glibc 2.35), takes the content and the bundled original Add-Ons from the
# same draft releases the Windows build fetches (tools/ci_content.py,
# tools/addon_bundle.py), packages with tools/package_playtest.sh and keeps
# the zip as the linux-release artifact. release.yml calls it alongside the
# Windows build; run on its own with publish on, it adds the zip to an
# existing release. It never replaces an asset.
name: linux-release-asset

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      ref:
        type: string
        required: true
      publish:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, such as v0.1.0-alpha (also the version the game shows)'
        required: true
        default: v0.1.0-alpha
      ref:
        description: 'Commit or branch to build (the release commit, with the Linux packager)'
        required: true
        default: main
      publish:
        description: 'Attach the zip to the existing release (off: artifact only)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BRI_VERSION: ${{ inputs.tag }}
  PUBLISH: ${{ inputs.publish }}
  GH_TOKEN: ${{ github.token }}
  SCCACHE_GHA_ENABLED: 'true'
  RUSTC_WRAPPER: sccache

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install the build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev

      # The same private content and credited original Add-Ons the Windows
      # build fetches; publish_release.py checks the three zips' base content
      # is byte-identical before a release is published.
      - name: Fetch the generated v20 content
        run: python3 tools/ci_content.py fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Fetch the Add-On bundle
        run: python3 tools/addon_bundle.py fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build the game, Add-On importer, dedicated server and modder tools
        run: cargo build --release --locked -p bri-client --bin bri-client -p bri-addon-import --bin bri-import-addon -p bri-net --bin bri-server -p bri-package-runtime --bin bri-addon-check -p bri-sim --bin bri-addon-run

      - name: Verify release panic capture
        run: cargo test --release --locked -p bri-crash --test capture

      # The packager strips these executables in place. Keep exact ELF files
      # with line tables before that step, separately from original content.
      - name: Retain matching unstripped executables
        run: |
          mkdir -p "$RUNNER_TEMP/linux-symbols"
          for binary in bri-client bri-import-addon bri-server bri-addon-check bri-addon-run; do
            cp "target/release/$binary" "$RUNNER_TEMP/linux-symbols/$binary"
          done
          python3 - "$RUNNER_TEMP/linux-symbols" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          files = [{'path': p.name, 'bytes': p.stat().st_size,
                    'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                   for p in sorted(root.iterdir()) if p.is_file()]
          manifest = {'schema_version': 1, 'version': os.environ['BRI_VERSION'],
                      'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'run_id': os.environ['GITHUB_RUN_ID'], 'platform': 'linux',
                      'rustc': subprocess.check_output(['rustc', '-vV'], text=True), 'files': files}
          (root / 'SYMBOLS.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@v5
        with:
          name: linux-debug-symbols
          path: ${{ runner.temp }}/linux-symbols/
          retention-days: 90
          if-no-files-found: error

      - name: Startup check against the content
        run: |
          target/release/bri-client --check content "$RUNNER_TEMP/bri-check-state"
          target/release/bri-client --version

      - name: Package
        run: |
          tools/package_playtest.sh --version "$BRI_VERSION" --sha256 "$(sha256sum target/release/bri-client | cut -d' ' -f1)"
          zip=dist/BlocklandReImagined-linux.zip
          rm -rf "$RUNNER_TEMP/check" && mkdir "$RUNNER_TEMP/check" && unzip -q "$zip" -d "$RUNNER_TEMP/check"
          tools/package_playtest.sh --verify "$RUNNER_TEMP"/check/*
          roots=("$RUNNER_TEMP/check"/*)
          test "${#roots[@]}" -eq 1
          game="${roots[0]}"
          "$game/bri-client" --check "$game/content" "$RUNNER_TEMP/bri-zip-state"
          "$game/bri-client" --version
          ls -l "$zip"
          echo "LINUX_ZIP=$zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: linux-release
          path: ${{ env.LINUX_ZIP }}
          retention-days: 30

      - name: Attach the zip to the release
        if: env.PUBLISH == 'true'
        run: gh release upload "$BRI_VERSION" "$LINUX_ZIP"
