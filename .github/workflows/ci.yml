# Content-free checks. Tests that need the generated v20 content are
# #[ignore]d or listed as ci_skip_target in tools/gate-known-failures.toml;
# the local push gate (tools/gate.py) runs them all. Pull requests and pushes
# run the "pr" tier, which leaves the slow offscreen renders
# (ci_nightly_target) to the nightly and manual runs; the push gate runs
# those too, on a real GPU, before anything reaches main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

# Superseded PR runs are cancelled; every push to main gets its own run so
# main's history shows which commit broke it.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # sccache keeps the workspace's library crates in the Actions cache, so a
  # library compiles once across jobs and runs; rust-cache keeps the
  # crates.io dependencies. Test and binary targets are linked executables,
  # which sccache cannot cache, so each shard builds only its own share of
  # them (tools/gate.py --ci-test --shard).
  SCCACHE_GHA_ENABLED: 'true'
  # The shards build first and test for up to half an hour; a server that
  # outlives its idle limit reports nothing at the end of the job.
  SCCACHE_IDLE_TIMEOUT: '0'
  RUSTC_WRAPPER: sccache
  TEST_TIER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'pr' }}

jobs:
  linux-wheel:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-wheel
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Compile Linux backends and check legacy X11 wheel routing headlessly
        run: cargo test --locked -p bri-client --test x11_wheel

  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: History check (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python tools/gate.py --history-range ${{ github.event.before }} ${{ github.sha }}
      - name: History check (pull request)
        if: github.event_name == 'pull_request'
        run: python tools/gate.py --history-range ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
      - name: Format
        run: python tools/check_format.py
      - name: Documentation links and packaged guides
        run: python tools/check_docs.py
      - name: Tool tests
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: No Visual C++ Redistributable needed
        run: python tools/check_windows_imports.py target/debug/bri-client.exe target/debug/bri-server.exe target/debug/bri-import-addon.exe target/debug/bri-addon-check.exe target/debug/bri-addon-run.exe
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Serial software-GPU coverage runs past two hours on one hosted Windows
  # runner, so the test targets are split into even shares, one runner
  # each (tools/gate.py --shard); together they run every target once.
  # A test binary still running after 30 minutes is stopped as hung (the
  # gate's own limit is ten): the hosted runner draws on the WARP software
  # renderer, where the lighting and mirror targets take several minutes.
  test:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Provision software graphics for offscreen tests
        run: ./tools/setup_ci_gpu.ps1
      - name: Test (${{ env.TEST_TIER }} tier, shard ${{ matrix.shard }} of 4)
        run: python tools/gate.py --ci-test --tier ${{ env.TEST_TIER }} --shard ${{ matrix.shard }}/4 --binary-timeout 30
        env:
          WGPU_BACKEND: dx12
          WGPU_DX12_COMPILER: dxc
          RUST_TEST_THREADS: 1
