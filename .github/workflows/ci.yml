# Content-free checks. Tests that need the generated v20 content are
# #[ignore]d or listed as ci_skip_target in tools/gate-known-failures.toml;
# the local push gate (tools/gate.py) runs them all.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded PR runs are cancelled; every push to main gets a full run so
# main's history shows which commit broke it.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: windows-latest
    # Serial software-GPU coverage exceeds one hour on hosted Windows runners.
    # Individual test binaries retain the gate's ten-minute stall deadline.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: History check (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python tools/gate.py --history-range ${{ github.event.before }} ${{ github.sha }}
      - name: History check (pull request)
        if: github.event_name == 'pull_request'
        run: python tools/gate.py --history-range ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
      - name: Format
        run: cargo fmt --all --check
      - name: Tool tests
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Provision software graphics for offscreen tests
        run: ./tools/setup_ci_gpu.ps1
      - name: Test
        run: python tools/gate.py --ci-test
        env:
          WGPU_BACKEND: dx12
          WGPU_DX12_COMPILER: dxc
          RUST_TEST_THREADS: 1
