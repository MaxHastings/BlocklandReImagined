# Content-free checks. Tests that need the generated v20 content are
# #[ignore]d here and run in the local push gate (tools/gate.py).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: History check (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python tools/gate.py --history-range ${{ github.event.before }} ${{ github.sha }}
      - name: History check (pull request)
        if: github.event_name == 'pull_request'
        run: python tools/gate.py --history-range ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
