# Builds the macOS zip. It builds the client on an Apple silicon runner,
# takes the content and the bundled original Add-Ons from the same draft
# releases the Windows build fetches (tools/ci_content.py,
# tools/addon_bundle.py), packages with tools/package_mac.sh (an ad-hoc
# signed .app) and keeps the zip as the mac-release artifact. release.yml
# calls it alongside the Windows build; run on its own with publish on, it
# adds the zip to an existing release. It never replaces an asset.
name: mac-release-asset

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      ref:
        type: string
        required: true
      publish:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, such as v0.1.1-alpha (also the version the game shows)'
        required: true
      ref:
        description: 'Commit or branch to build (the release commit)'
        required: true
        default: main
      publish:
        description: 'Attach the zip to the existing release (off: artifact only)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BRI_VERSION: ${{ inputs.tag }}
  PUBLISH: ${{ inputs.publish }}
  GH_TOKEN: ${{ github.token }}
  SCCACHE_GHA_ENABLED: 'true'
  RUSTC_WRAPPER: sccache

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Bundle freshness queries Cargo metadata, so install its toolchain and
      # configured compiler wrapper before fetching/validating the bundle.
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-mac
      - uses: mozilla-actions/sccache-action@v0.0.9

      # The same private content and credited original Add-Ons the Windows
      # build fetches; publish_release.py checks the three zips' base content
      # is byte-identical before a release is published.
      - name: Fetch the generated v20 content
        run: python3 tools/ci_content.py fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Fetch the Add-On bundle
        run: python3 tools/addon_bundle.py fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the game, Add-On importer and modder tools
        run: cargo build --release --locked -p bri-client --bin bri-client -p bri-addon-import --bin bri-import-addon -p bri-package-runtime --bin bri-addon-check -p bri-sim --bin bri-addon-run

      - name: Verify release panic capture
        run: cargo test --release --locked -p bri-crash --test capture

      - name: Retain matching executables and dSYMs
        run: |
          mkdir -p "$RUNNER_TEMP/mac-symbols"
          for binary in bri-client bri-import-addon bri-addon-check bri-addon-run; do
            cp "target/release/$binary" "$RUNNER_TEMP/mac-symbols/$binary"
            dsymutil "target/release/$binary" -o "$RUNNER_TEMP/mac-symbols/$binary.dSYM"
          done
          python3 - "$RUNNER_TEMP/mac-symbols" <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          def uuids(path):
              output = subprocess.check_output(['dwarfdump', '--uuid', str(path)], text=True)
              return sorted(re.findall(r'UUID: ([0-9A-Fa-f-]+) \(([^)]+)\)', output))
          binaries = []
          for name in ['bri-client', 'bri-import-addon', 'bri-addon-check', 'bri-addon-run']:
              executable_uuids = uuids(root / name)
              if not executable_uuids or executable_uuids != uuids(root / (name + '.dSYM')):
                  sys.exit(f'::error::{name} dSYM UUID does not match the built executable')
              binaries.append({'path': name, 'mach_o_uuids': executable_uuids})
          files = [{'path': p.relative_to(root).as_posix(), 'bytes': p.stat().st_size,
                    'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                   for p in sorted(root.rglob('*')) if p.is_file()]
          manifest = {'schema_version': 1, 'version': os.environ['BRI_VERSION'],
                      'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'run_id': os.environ['GITHUB_RUN_ID'], 'platform': 'macos',
                      'rustc': subprocess.check_output(['rustc', '-vV'], text=True),
                      'binaries': binaries, 'files': files}
          (root / 'SYMBOLS.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@v5
        with:
          name: mac-debug-symbols
          path: ${{ runner.temp }}/mac-symbols/
          retention-days: 90
          if-no-files-found: error

      - name: Startup check against the content
        run: |
          target/release/bri-client --check content "$RUNNER_TEMP/bri-check-state"
          target/release/bri-client --version

      - name: Package
        run: |
          tools/package_mac.sh --version "$BRI_VERSION" --sha256 "$(shasum -a 256 target/release/bri-client | cut -d' ' -f1)"
          zip=dist/BlocklandReImagined-macos.zip
          tools/package_mac.sh --verify "$zip"
          ls -l "$zip"
          echo "MAC_ZIP=$zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: mac-release
          path: ${{ env.MAC_ZIP }}
          retention-days: 30

      - name: Extracted app startup smoke
        run: |
          mkdir -p "$RUNNER_TEMP/mac-smoke"
          ditto -x -k "$MAC_ZIP" "$RUNNER_TEMP/mac-smoke"
          roots=("$RUNNER_TEMP/mac-smoke"/*)
          test "${#roots[@]}" -eq 1
          game="${roots[0]}/BlocklandReImagined.app/Contents"
          "$game/MacOS/bri-client" --check "$game/Resources/content" "$RUNNER_TEMP/bri-zip-state"
          "$game/MacOS/bri-client" --version
          python3 - "$RUNNER_TEMP/mac-symbols/SYMBOLS.json" "$game/MacOS" <<'PY'
          import json, pathlib, re, subprocess, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          for binary in manifest['binaries']:
              executable = pathlib.Path(sys.argv[2]) / binary['path']
              output = subprocess.check_output(['dwarfdump', '--uuid', str(executable)], text=True)
              actual = sorted([list(v) for v in re.findall(r'UUID: ([0-9A-Fa-f-]+) \(([^)]+)\)', output)])
              if actual != binary['mach_o_uuids']:
                  sys.exit(f"::error::{executable.name} packaged UUID differs from retained symbols")
          PY

      - name: Attach the zip to the release
        if: env.PUBLISH == 'true'
        run: gh release upload "$BRI_VERSION" "$MAC_ZIP"
