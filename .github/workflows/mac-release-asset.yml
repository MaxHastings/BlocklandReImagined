# Adds the macOS zip to an existing release. It builds the client on an Apple
# silicon runner, takes the content from that release's Windows zip (drafts included)
# (checked against its MANIFEST.json), packages with tools/package_mac.sh
# (an ad-hoc signed .app) and uploads the zip. It never replaces an asset.
name: mac-release-asset

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      ref:
        type: string
        required: true
      windows_run:
        type: string
        default: ''
      publish:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, such as v0.1.1-alpha (also the version the game shows)'
        required: true
      ref:
        description: 'Commit or branch to build (the release commit)'
        required: true
        default: main
      publish:
        description: 'Attach the zip to the existing release (off: artifact only)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BRI_VERSION: ${{ inputs.tag }}
  WINDOWS_RUN: ${{ inputs.windows_run }}
  PUBLISH: ${{ inputs.publish }}
  GH_TOKEN: ${{ github.token }}

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Take and verify the Windows package content
        run: |
          if [ -n "$WINDOWS_RUN" ]; then
            gh run download "$WINDOWS_RUN" --name "BlocklandReImagined-$BRI_VERSION-windows" --dir "$RUNNER_TEMP/win"
          else
            gh release download "$BRI_VERSION" --pattern 'BlocklandReImagined-windows.zip' --dir "$RUNNER_TEMP/win"
          fi
          unzip -q "$RUNNER_TEMP"/win/*.zip -d "$RUNNER_TEMP/win/x"
          python3 - "$RUNNER_TEMP"/win/x/* <<'PY'
          import hashlib, json, pathlib, shutil, sys
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / 'MANIFEST.json').read_text(encoding='utf-8-sig'))
          for entry in manifest['files']:
              data = (root / entry['path']).read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  sys.exit(f"::error::{entry['path']} does not match the Windows MANIFEST.json")
          packs = json.loads(pathlib.Path('crates/package/base-packages.json').read_text(encoding='utf-8'))['packages']
          content = pathlib.Path('content')
          content.mkdir(exist_ok=True)
          for pack in packs:
              source = root / 'content' / pack['dir']
              if not source.is_dir():
                  sys.exit(f"::error::the Windows zip has no {pack['dir']}")
              shutil.copytree(source, content / pack['dir'])
          print(f"Windows {manifest['version']}: {len(manifest['files'])} files verified, {len(packs)} packs taken.")
          PY

      # The original classic Add-Ons and their credits, taken from the same
      # verified Windows zip, so this zip ships exactly what Windows does
      # (tools/addon_bundle.py from-release).
      - name: Take the bundled originals from the Windows zip
        run: python3 tools/addon_bundle.py from-release "$RUNNER_TEMP"/win/x/*

      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-mac

      - name: Build the game and Add-On importer
        run: cargo build --release --locked -p bri-client --bin bri-client -p bri-addon-import --bin bri-import-addon

      - name: Verify release panic capture
        run: cargo test --release --locked -p bri-crash --test capture

      - name: Retain matching executables and dSYMs
        run: |
          mkdir -p "$RUNNER_TEMP/mac-symbols"
          for binary in bri-client bri-import-addon; do
            cp "target/release/$binary" "$RUNNER_TEMP/mac-symbols/$binary"
            dsymutil "target/release/$binary" -o "$RUNNER_TEMP/mac-symbols/$binary.dSYM"
          done
          python3 - "$RUNNER_TEMP/mac-symbols" <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          def uuids(path):
              output = subprocess.check_output(['dwarfdump', '--uuid', str(path)], text=True)
              return sorted(re.findall(r'UUID: ([0-9A-Fa-f-]+) \(([^)]+)\)', output))
          binaries = []
          for name in ['bri-client', 'bri-import-addon']:
              executable_uuids = uuids(root / name)
              if not executable_uuids or executable_uuids != uuids(root / (name + '.dSYM')):
                  sys.exit(f'::error::{name} dSYM UUID does not match the built executable')
              binaries.append({'path': name, 'mach_o_uuids': executable_uuids})
          files = [{'path': p.relative_to(root).as_posix(), 'bytes': p.stat().st_size,
                    'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                   for p in sorted(root.rglob('*')) if p.is_file()]
          manifest = {'schema_version': 1, 'version': os.environ['BRI_VERSION'],
                      'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'run_id': os.environ['GITHUB_RUN_ID'], 'platform': 'macos',
                      'rustc': subprocess.check_output(['rustc', '-vV'], text=True),
                      'binaries': binaries, 'files': files}
          (root / 'SYMBOLS.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@v5
        with:
          name: mac-debug-symbols
          path: ${{ runner.temp }}/mac-symbols/
          retention-days: 90
          if-no-files-found: error

      - name: Startup check against the content
        run: |
          target/release/bri-client --check content "$RUNNER_TEMP/bri-check-state"
          target/release/bri-client --version

      - name: Package
        run: |
          tools/package_mac.sh --version "$BRI_VERSION" --sha256 "$(shasum -a 256 target/release/bri-client | cut -d' ' -f1)"
          zip=dist/BlocklandReImagined-macos.zip
          tools/package_mac.sh --verify "$zip"
          ls -l "$zip"
          echo "MAC_ZIP=$zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: mac-release
          path: ${{ env.MAC_ZIP }}
          retention-days: 30

      - name: Extracted app startup smoke
        run: |
          mkdir -p "$RUNNER_TEMP/mac-smoke"
          ditto -x -k "$MAC_ZIP" "$RUNNER_TEMP/mac-smoke"
          roots=("$RUNNER_TEMP/mac-smoke"/*)
          test "${#roots[@]}" -eq 1
          game="${roots[0]}/BlocklandReImagined.app/Contents"
          "$game/MacOS/bri-client" --check "$game/Resources/content" "$RUNNER_TEMP/bri-zip-state"
          "$game/MacOS/bri-client" --version
          python3 - "$RUNNER_TEMP/mac-symbols/SYMBOLS.json" "$game/MacOS" <<'PY'
          import json, pathlib, re, subprocess, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          for binary in manifest['binaries']:
              executable = pathlib.Path(sys.argv[2]) / binary['path']
              output = subprocess.check_output(['dwarfdump', '--uuid', str(executable)], text=True)
              actual = sorted([list(v) for v in re.findall(r'UUID: ([0-9A-Fa-f-]+) \(([^)]+)\)', output)])
              if actual != binary['mach_o_uuids']:
                  sys.exit(f"::error::{executable.name} packaged UUID differs from retained symbols")
          PY

      - name: Attach the zip to the release
        if: env.PUBLISH == 'true'
        run: gh release upload "$BRI_VERSION" "$MAC_ZIP"
