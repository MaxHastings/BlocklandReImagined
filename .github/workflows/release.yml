# Builds the Windows, macOS and Linux releases side by side and, when
# publishing, puts all three on one GitHub Release with SHA256SUMS
# (tools/publish_release.py): the zips players download, and what the game's
# update check reads. Same recipe as a release built by hand
# (docs/playtest-package-layout.md); setup and use in docs/release-builds.md.
#
# Push a date tag (git tag 2026-10-02-a19 && git push origin 2026-10-02-a19)
# or run it from the Actions tab with a version. With publish off it only
# builds; tools/release.py starts it that way while the PC gate runs, and
# pushing the v* tag afterwards publishes those same zips
# (publish-release.yml) instead of building again.
name: release
run-name: release ${{ github.event.inputs.version || github.ref_name }}${{ github.event.inputs.publish == 'false' && ' (build only)' || '' }}

on:
  push:
    tags: ['[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, such as 2026-10-02-a19 (becomes the tag)'
        required: true
      publish:
        description: 'Publish a GitHub Release (off: build and keep the files as a workflow artifact only)'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  # Publishing the release, and reading the ci-content draft release.
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BRI_VERSION: ${{ github.event.inputs.version || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
  # sccache keeps the workspace's own crates between release builds, as in
  # ci.yml; rust-cache keeps only the crates.io dependencies.
  SCCACHE_GHA_ENABLED: 'true'
  RUSTC_WRAPPER: sccache

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the version
        shell: pwsh
        run: |
          if ($env:BRI_VERSION -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$') {
            Write-Output "::error::'$env:BRI_VERSION' is not a release version: use letters, digits, dot, underscore or dash, such as 2026-10-02-a19."
            exit 1
          }
          if ($env:PUBLISH -eq 'true') {
            gh release view $env:BRI_VERSION *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Output "::error::A release named $env:BRI_VERSION already exists. Pick a new version."
              exit 1
            }
          }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Bundle freshness walks Cargo's converter dependency graph. Its metadata
      # query needs rustc and the configured RUSTC_WRAPPER before fetching.
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - uses: mozilla-actions/sccache-action@v0.0.9

      # Fails here, before any build, when Max has not uploaded the content.
      - name: Fetch the generated v20 content
        run: python tools/ci_content.py fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The original classic Add-Ons the release bundles, with credit
      # (tools/addon_bundle.py). Fails here when the Gate has not uploaded
      # a bundle that has every pinned original.
      - name: Fetch the Add-On bundle
        run: python tools/addon_bundle.py fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the game, Add-On importer, dedicated server and modder tools
        run: cargo build --release --locked -p bri-client --bin bri-client -p bri-addon-import --bin bri-import-addon -p bri-net --bin bri-server -p bri-package-runtime --bin bri-addon-check -p bri-sim --bin bri-addon-run

      - name: No Visual C++ Redistributable needed
        run: python tools/check_windows_imports.py target/release/bri-client.exe target/release/bri-server.exe target/release/bri-import-addon.exe target/release/bri-addon-check.exe target/release/bri-addon-run.exe

      - name: Verify release panic capture
        run: cargo test --release --locked -p bri-crash --test capture

      - name: Startup check against the content
        shell: pwsh
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'bri-check-state'
          # A release bri-client.exe is a windowed program, which PowerShell
          # starts without waiting for: wait on it and read its exit code.
          $check = Start-Process -FilePath .\target\release\bri-client.exe -ArgumentList @('--check', 'content', "`"$state`"") -NoNewWindow -Wait -PassThru
          if ($check.ExitCode -ne 0) { exit $check.ExitCode }
          .\target\release\bri-client.exe --version

      - name: Package
        shell: pwsh
        run: |
          $hash = (Get-FileHash target\release\bri-client.exe -Algorithm SHA256).Hash
          $pack = @{ Version = $env:BRI_VERSION; ExpectedExecutableSha256 = $hash }
          .\tools\package_playtest.ps1 @pack
          "RELEASE_NAME=BlocklandReImagined-$env:BRI_VERSION-windows" >> $env:GITHUB_ENV

      # What a player gets: the zip unzips to one release folder whose
      # manifest matches, and the game starts from there. (The loopback-join
      # smoke needs an original v20 Add-On archive and a GPU, so it stays on
      # the PC gate.)
      - name: Zip smoke
        shell: pwsh
        run: |
          $unzipped = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive dist\BlocklandReImagined-windows.zip $unzipped
          $tops = @(Get-ChildItem $unzipped)
          if ($tops.Count -ne 1 -or $tops[0].Name -cne $env:RELEASE_NAME) { Write-Output "::error::the zip must hold exactly $env:RELEASE_NAME"; exit 1 }
          $game = $tops[0].FullName
          .\tools\package_playtest.ps1 -VerifyPackage $game
          $state = Join-Path $env:RUNNER_TEMP 'bri-zip-state'
          Remove-Item -Recurse -Force $state -ErrorAction SilentlyContinue
          # Windowed program: wait for it, so its report exists before it is read.
          $check = Start-Process -FilePath (Join-Path $game 'bri-client.exe') -ArgumentList @('--check', "`"$(Join-Path $game 'content')`"", "`"$state`"") -NoNewWindow -Wait -PassThru
          if ($check.ExitCode -ne 0) { exit $check.ExitCode }
          # Every Add-On a release ships must load. A bundle imported before a
          # pack schema change is only a warning to --check (v0.2.6 preview
          # fd719c9 left out every bundled brick pack: "Unknown weapon schema
          # 3"), so the release reads the report --check writes and fails on
          # a missing report or any Add-On left out.
          $report = Join-Path $state 'logs\add-on-health.json'
          if (-not (Test-Path $report)) { Write-Output "::error::--check wrote no $report"; exit 1 }
          $health = Get-Content $report -Raw | ConvertFrom-Json
          if ($health.schema_version -ne 1) { Write-Output "::error::add-on-health.json schema $($health.schema_version), this step reads 1"; exit 1 }
          $leftOut = @($health.problems | Where-Object { $_.kind -eq 'left_out' })
          if ($leftOut.Count) {
            $leftOut | Select-Object -First 5 | ForEach-Object { Write-Output "::error::$($_.add_on) left out: $($_.effect)" }
            Write-Output "::error::$($leftOut.Count) shipped Add-On(s) left out; rebuild the stale pack or bundle (tools/addon_bundle.py upload)"
            exit 1
          }

      - name: Gather release files
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force upload
          Copy-Item dist\BlocklandReImagined-windows.zip $out
          # Debug symbols for crash reports: kept with the run, not shipped.
          $symbols = New-Item -ItemType Directory -Force "symbols\$env:RELEASE_NAME-symbols"
          Copy-Item target\release\*.pdb $symbols
          Get-ChildItem $out, $symbols | Format-Table Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.RELEASE_NAME }}-symbols
          path: symbols
          retention-days: 90

      # Always kept: the publish job below, and publish-release.yml for a
      # build-only run, take the zip from here.
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.RELEASE_NAME }}
          path: upload
          retention-days: 30

  # The Mac and Linux builds take the same content and Add-On bundle from the
  # draft releases as Windows does, so they run alongside it instead of after
  # it; the publish step checks the three zips carry identical base content.
  mac:
    uses: ./.github/workflows/mac-release-asset.yml
    with:
      tag: ${{ github.event.inputs.version || github.ref_name }}
      ref: ${{ github.sha }}
      publish: false

  linux:
    uses: ./.github/workflows/linux-release-asset.yml
    with:
      tag: ${{ github.event.inputs.version || github.ref_name }}
      ref: ${{ github.sha }}
      publish: false

  publish:
    needs: [release, mac, linux]
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$BRI_VERSION.md"
          python3 tools/publish_release.py --version "$BRI_VERSION" --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --notes "$notes"
